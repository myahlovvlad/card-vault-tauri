name: ios-build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    # iOS builds require Xcode, which is only available on macOS runners.
    # This is the only place CardVault's iOS target is built/verified — there is
    # no Mac in the local dev setup, so the Windows machine cannot run or test
    # this app on a real device or simulator; use this workflow's artifact
    # (or a real Mac) for that instead.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - run: npm install --no-audit --no-fund

      # Simulator target so the build needs no Apple signing certificate/provisioning
      # profile — enough to prove the Rust/Swift/webview side actually builds.
      # A real device/App Store build additionally needs APPLE_* signing secrets
      # and `npx tauri ios build --target aarch64` (or --export-method for .ipa).
      - name: Initialize Tauri iOS project
        run: npx tauri ios init

      - name: Build iOS app (simulator target)
        run: npx tauri ios build --target aarch64-sim --debug

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: cardvault-ios-simulator
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
