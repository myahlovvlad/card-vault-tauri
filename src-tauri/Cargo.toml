[package]
name = "card-vault"
version = "0.1.0"
description = "Cross-platform business card organizer with OCR"
authors = ["CardVault contributors"]
edition = "2021"

[lib]
name = "card_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
